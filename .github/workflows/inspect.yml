name: Inspect demoparser2
on:
  push:
    branches: [inspect-parser]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build + test
        run: |
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read()[:60000], safe=' /:.,;=+-_()[]{}<>\"\'*!?@#\$^&|~\`'))"; }
          sudo apt-get install -y protobuf-compiler >/dev/null
          git clone --depth 1 https://github.com/LaihoE/demoparser /tmp/dp
          bash scripts/patch-parser.sh /tmp/dp
          rustup target add wasm32-unknown-unknown
          npm i -g wasm-pack >/dev/null 2>&1
          (cd /tmp/dp/src/wasm && wasm-pack build --release --target no-modules --out-dir /tmp/pkg > /tmp/b.log 2>&1) || echo "::notice title=build-fail::$(tail -c 4000 /tmp/b.log | enc)"
          echo "::notice title=test-head::$(node scripts/test-parser.cjs /tmp/pkg /tmp/dp/src/parser/test_demo.dem 2>&1 | enc)"
