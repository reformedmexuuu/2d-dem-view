name: Inspect demoparser2
on:
  push:
    branches: [inspect-parser]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: build parser
        run: |
          enc() { python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read()[:60000], safe=' /:.,;=+-_()[]{}<>\"\'*!?@#\$^&|~\`'))"; }
          sudo apt-get install -y protobuf-compiler >/dev/null
          npm run parser > /tmp/p.log 2>&1; code=$?
          echo "::notice title=parser-build::exit=$code $(grep -E 'demoparser commit|Patching|rounds|PIPELINE|Parser:|warning|error' /tmp/p.log | tail -30 | enc)"
          echo "::notice title=origin::$(cat public/parser/origin.txt)"
